# ==============================================================================
# RabbitHole Configuration
# ==============================================================================
# This file is sourced by the RabbitHole framework on startup.
# Values set here override framework defaults.
# ==============================================================================

# Installation directories
# RABBIT_INSTALL_DIR="/opt/rabbithole"
# RABBIT_BIN_DIR="/usr/local/bin"

# Logging
# RABBIT_LOG_FILE="./rabbithole.log"
# RABBIT_QUIET="false"
# RABBIT_STRUCTURED="false"

# State management
# RABBIT_STATE_DIR="${HOME}/.rabbithole"

# Profile selection (minimal, research, lab, redteam, blueteam, enterprise)
# RABBIT_PROFILE="research"

# Supply chain security
# RABBIT_VERIFY_CHECKSUMS="true"
# RABBIT_PIN_VERSIONS="true"

# Cache
# RABBIT_CACHE_DIR="${RABBIT_STATE_DIR}/cache"

# Docker
# RABBIT_DOCKER_COMPOSE_DIR="/opt/rabbithole/infra/threat-intel"
